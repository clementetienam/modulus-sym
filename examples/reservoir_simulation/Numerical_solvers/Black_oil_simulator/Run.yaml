# DATA PATHS
# iglesisas 2 = 33,33,1
#iglesias3 = 40,40,3
#test.out = 40,60,5

##=============================================================================##
##                                                                             ##
##                   RESERVOIR SIMULATION INPUT DECK                           ##
##                                                                             ##
##   Model         : iglesias3.out  (40 x 40 x 3  |  4,800 active cells)      ##
##   Simulator     : NVRS-FVM v1.0  (NVIDIA GPU-Accelerated Finite Volume)    ##
##   Flow regime   : Black-oil  |  2-Phase (oil-water)                        ##
##   Coordinate    : Cartesian, uniform DX/DY/DZ                              ##
##                                                                             ##
##   Prepared by   : NVIDIA DevTech – Energy & HPC                            ##
##   Revision      : 1.0                                                       ##
##                                                                             ##
##=============================================================================##


## ─────────────────────────────────────────────────────────────────────────── ##
##  SECTION 1 — FILE PATHS                                                     ##
## ─────────────────────────────────────────────────────────────────────────── ##

INCLUDE:
    path_trueK  : "data/test.out"    # Absolute permeability field (Kx, Ky, Kz)
    path_out    : "OUTPUTS"               # Root directory for all simulation outputs


## ─────────────────────────────────────────────────────────────────────────── ##
##  SECTION 2 — RUN CONTROL                                                    ##
## ─────────────────────────────────────────────────────────────────────────── ##

RUNSPEC:
    title         : "RESERVOIR MODEL REFERENCE CASE"
    N_components  : 3          # 2 = two-phase (oil-water)  |  3 = three-phase (oil-water-gas)

SOLVER:
    ##  1 = GMRES            4 = LSQR
    ##  2 = spsolve (direct) 5 = BiCGSTAB
    ##  3 = Conjugate Gradient (SPD only)
    ##  6 = CPR  (Constrained Pressure Residual — recommended for reservoir)
    solution_method : 6        # CPR — optimal for heterogeneous black-oil systems

NSTACK:
    n_substep : 10             # Sub-steps for implicit saturation update (recommended: 3–20)


## ─────────────────────────────────────────────────────────────────────────── ##
##  SECTION 3 — SUMMARY OUTPUT                                                 ##
## ─────────────────────────────────────────────────────────────────────────── ##

SUMMARY:
    make_csv        : 1        # 1 = Export well rates / BHP to RSM_FVM.csv
    make_animation  : 1        # 1 = Generate P / Sw GIF animations per timestep
    make_gassman    : 1        # 1 = Compute and animate Gassmann seismic impedance


## ─────────────────────────────────────────────────────────────────────────── ##
##  SECTION 4 — GRID DIMENSIONS                                                ##
## ─────────────────────────────────────────────────────────────────────────── ##

DIMENS:
    nx : 46    # Grid blocks in I-direction
    ny : 112    # Grid blocks in J-direction
    nz :  22    # Grid blocks in K-direction (layers)


GRID:
    DX : 50    # [ft]  Cell size – I-direction (uniform)
    DY : 50    # [ft]  Cell size – J-direction (uniform)
    DZ : 20    # [ft]  Cell thickness – K-direction (uniform)

MULTIPLY:
    z_factor : 0.2    # Kz = z_factor * Kx  (vertical-to-horizontal permeability ratio)


## ─────────────────────────────────────────────────────────────────────────── ##
##  SECTION 5 — PETROPHYSICAL PROPERTIES                                       ##
## ─────────────────────────────────────────────────────────────────────────── ##

PROPS:
    ## --- Fluid Viscosities ---------------------------------------------------
    UW : 1.0     # [cP]      Water viscosity
    UO : 2.5     # [cP]      Oil viscosity
    UG : 0.02     # [cP]      Oil viscosity

    ## --- Saturation Limits --------------------------------------------------
    SWI : 0.1    # [-]       Connate (irreducible) water saturation
    SWR : 0.1    # [-]       Residual water saturation

    ## --- Compressibility ----------------------------------------------------
    CFW : 0.00001    # [1/psi]   Water compressibility
    CFO : 0.00001    # [1/psi]   Oil compressibility
    CT  : 0.00002    # [1/psi]   Total system compressibility

    ## --- Initial Conditions -------------------------------------------------
    S1  : 0.2    # [-]       Initial water saturation
    SG1 : 0.02    # [-]      Initial gas saturation  (set > 0 if N_components = 3)
    SO1 : 0.75    # [-]       Initial oil saturation  (S1 + SG1 + SO1 = 1.0)
    P1  : 3000   # [psia]    Initial reservoir pressure
    PB  : 3000   # [psia]    Bubble-point pressure

    ## --- Formation Volume Factors -------------------------------------------
    BW  : 1.0    # [RB/STB]  Water FVF  (at reservoir conditions)
    BO  : 1.2    # [RB/STB]  Oil FVF    (at bubble-point)
    BG  : 0.005    # [RB/SCF]  ← ADD THIS (typical at ~3000 psia)

    ## --- Reference Pressure -------------------------------------------------
    PATM : 14.6959    # [psia]    Atmospheric pressure (standard conditions)

    ## --- Gravity ------------------------------------------------------------
    isGravity : 1     # 1 = gravity active  |  0 = gravity off
    RHOW      : 1.0   # [g/cc]    Water density at standard conditions
    RHOO      : 1.0   # [g/cc]    Oil density   at standard conditions
    RHOG      : 1.0   # [g/cc]    Gas density   at standard conditions


## ─────────────────────────────────────────────────────────────────────────── ##
##  SECTION 6 — RELATIVE PERMEABILITY TABLES                                   ##
## ─────────────────────────────────────────────────────────────────────────── ##

    ## --- SWOF: Water-Oil System (Sw, Krow, Krw) ----------------------------
    ##     Sw     Krow    Krw
    SWOW:
    - [0.00,  1.0000, 0.0000]    # Connate water  – Krow = 1 (endpoint)
    - [0.30,  1.0000, 0.0000]
    - [0.35,  0.5900, 0.0100]
    - [0.40,  0.3200, 0.0200]
    - [0.45,  0.1800, 0.0340]
    - [0.50,  0.0800, 0.0460]
    - [0.55,  0.0300, 0.0680]
    - [0.60,  0.0100, 0.0900]
    - [0.65,  0.0010, 0.1280]
    - [0.70,  0.0001, 0.1660]
    - [0.75,  0.0000, 0.2000]
    - [0.80,  0.0000, 0.2400]
    - [1.00,  0.0000, 0.2400]    # Residual oil   – Krw = Krw_max (endpoint)

    ## --- SGOF: Gas-Oil System (Sg, Krog, Krg) – active if N_components = 3 --
    ##     Sg     Krog    Krg
    SWOG:
    - [0.00,  1.0000, 0.0000]    # Zero gas saturation  – Krog = 1 (endpoint)
    - [0.03,  0.7500, 0.0000]
    - [0.05,  0.5900, 0.0200]
    - [0.10,  0.3200, 0.0900]
    - [0.15,  0.1800, 0.1600]
    - [0.20,  0.0800, 0.2400]
    - [0.25,  0.0300, 0.3300]
    - [0.30,  0.0100, 0.4300]
    - [0.35,  0.0010, 0.5500]
    - [0.40,  0.0000, 0.6700]
    - [0.45,  0.0000, 0.8100]
    - [0.50,  0.0000, 1.0000]    # Residual oil   – Krg = 1 (endpoint)
    - [1.00,  0.0000, 1.0000]


## ─────────────────────────────────────────────────────────────────────────── ##
##  SECTION 7 — ROCK PROPERTIES                                                ##
## ─────────────────────────────────────────────────────────────────────────── ##

ROCK:
    MPOR : 0.05    # [-]    Minimum (cutoff) porosity
    HPOR : 0.30    # [-]    Maximum porosity
    aay  :   5     # [mD]   Minimum permeability (applied during perm mapping)
    bby  : 500     # [mD]   Maximum permeability (applied during perm mapping)


## ─────────────────────────────────────────────────────────────────────────── ##
##  SECTION 8 — TIME CONTROL                                                   ##
## ─────────────────────────────────────────────────────────────────────────── ##

REPORTING:
    time_step       :  100    # [days]  Simulation timestep (advance interval)
    time_max        : 2000    # [days]  End of active simulation period
    time_limit      : 6000    # [days]  Hard cutoff for simulation run
    time_step_plot  :  200    # [days]  Output / animation frequency


## ─────────────────────────────────────────────────────────────────────────── ##
##  SECTION 9 — WELL SPECIFICATIONS                                            ##
## ─────────────────────────────────────────────────────────────────────────── ##
##
##   Column layout:
##   [I,  J,  Type,  Rate,      Rw(ft),  Skin,  Pwf(psia),  Dir,  Name]
##
##   Type  : 1 = injector  |  -1 = producer
##   Rate  : [BBL/D]  positive = injection  |  -1 = BHP-controlled production
##   Dir   : 1 = vertical well
##

WELLSPECS:

    # injector_wells:
    # ##    I    J  Type   Rate   Rw     Skin   Pwf    Dir   Name
    # - [  1,  24,   1,  1000,  500,   0.0,   100,    1,  'I1']
    # - [  3,   3,   1,  1000,  500,   0.0,   100,    1,  'I2']
    # - [ 31,   1,   1,  1000,  500,   0.0,   100,    1,  'I3']
    # - [ 31,  31,   1,  1000,  500,   0.0,   100,    1,  'I4']

    # producer_wells:
    # ##    I    J  Type   Rate   Rw     Skin   Pwf    Dir   Name
    # - [  7,   9,   1,    -1,  100,   0.0,   100,    1,  'P1']
    # - [ 14,  12,   1,    -1,  100,   0.0,   100,    1,  'P2']
    # - [ 28,  19,   1,    -1,  100,   0.0,   100,    1,  'P3']
    # - [ 14,  27,   1,    -1,  100,   0.0,   100,    1,  'P4']


    injector_wells:
    ##    I    J  Type   Rate   Rw     Skin   Pwf    Dir   Name
    - [  10,  91,   1,  1000,  500,   0.0,   100,    1,  'I1']
    - [  3,   3,   1,  1000,  500,   0.0,   100,    1,  'I2']
    - [ 40,   10,   1,  1000,  500,   0.0,   100,    1,  'I3']
    - [ 40,  80,   1,  1000,  500,   0.0,   100,    1,  'I4']

    producer_wells:
    ##    I    J  Type   Rate   Rw     Skin   Pwf    Dir   Name
    - [  7,   9,   1,    -1,  100,   0.0,   100,    1,  'P1']
    - [ 30,  91,   1,    -1,  100,   0.0,   100,    1,  'P2']
    - [ 28,  19,   1,    -1,  100,   0.0,   100,    1,  'P3']
    - [ 25,  64,   1,    -1,  100,   0.0,   100,    1,  'P4']

## ─────────────────────────────────────────────────────────────────────────── ##
##  SECTION 10 — SCHEDULE / WELL CONTROL                                       ##
## ─────────────────────────────────────────────────────────────────────────── ##
##
##   opennI  : Perforation strategy for injectors
##             'last'  = inject into bottom layer only (single perforation)
##             'all'   = inject across all K-layers   (multi-layer)
##
##   opennP  : Perforation strategy for producers
##             'last'  = produce from bottom layer only
##             'all'   = produce from all K-layers    (commingled)
##

SCHEDULE:
    opennI : 'all'     # Injectors  – bottom layer only : all/last
    opennP : 'all'     # Producers  – all layers (commingled):  all/last


##=============================================================================##
##  END OF INPUT DECK                                                           ##
##=============================================================================##